[project]
name = "recall-impact-investigator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "openai>=2,<3",
    "pydantic>=2.11,<3",
    "python-multipart>=0.0.22,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["mypy>=1.15,<3", "playwright>=1.57,<2", "pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["recall", "scripts"]

[tool.pytest.ini_options]
markers = ["browser: real HTTP and Chromium workflow"]
testpaths = ["tests"]
